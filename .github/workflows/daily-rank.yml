name: 키워드 순위 체크

on:
  schedule:
    - cron: "40 21 * * *"   # 매일 한국시간 오전 6:40 (조금 늦어질 수 있음)
  workflow_dispatch:         # Actions 화면에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 순위 확인
        run: python3 rank_check.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: 결과 저장
        run: |
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add data docs
          git commit -m "순위 기록 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push
